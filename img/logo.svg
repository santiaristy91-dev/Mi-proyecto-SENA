<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <linearGradient id="logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="green-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="280" height="60" rx="12" fill="url(#logo-bg)" stroke="rgba(16,185,129,0.3)" stroke-width="1.5"/>

  <!-- Battery & Lightning Icon -->
  <g transform="translate(14, 10)">
    <rect x="2" y="6" width="24" height="28" rx="5" fill="none" stroke="#64748b" stroke-width="2.5"/>
    <path d="M26 15C27.5 15 28.5 16 28.5 17.5V22.5C28.5 24 27.5 25 26 25" fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
    <path d="M16 8L8 20H15L13 32L21 20H14L16 8Z" fill="url(#green-glow)" filter="url(#neon-glow)"/>
  </g>

  <!-- Typography -->
  <text x="58" y="33" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="24" fill="#ffffff" letter-spacing="-0.5">
    Power<tspan fill="#10b981">Go</tspan>
  </text>
  <text x="58" y="47" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="700" font-size="8.5" fill="#94a3b8" letter-spacing="1.5">
    RED DE ENERGÍA MÓVIL
  </text>
</svg>
